<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayRise</title>
<link rel="manifest" href="manifest.json">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: #101114;
color: white;
font-family: Arial, sans-serif;
padding: 20px;
}
header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 30px;
}
.logo {
font-size: 27px;
font-weight: bold;
}
.logo span {
color: #a78bfa;
}
.date {
color: #999;
font-size: 13px;
margin-top: 6px;
}
.card {
background: #1c1d24;
padding: 20px;
border-radius: 18px;
margin-bottom: 20px;
}
.progress-title {
color: #aaa;
font-size: 14px;
}
.progress-number {
font-size: 36px;
font-weight: bold;
margin: 12px 0;
}
.progress-bg {
background: #33343c;
height: 9px;
border-radius: 20px;
overflow: hidden;
}
.progress-fill {
background: #a78bfa;
height: 100%;
width: 0%;
transition: .3s;
}
.stats {
display: flex;
gap: 12px;
margin-bottom: 25px;
}
.stat {
flex: 1;
background: #1c1d24;
padding: 16px 10px;
border-radius: 15px;
text-align: center;
}
.stat h2 {
color: #a78bfa;
font-size: 23px;
}
.stat p {
color: #999;
font-size: 12px;
margin-top: 6px;
}
.section-title {
font-size: 19px;
margin-bottom: 15px;
}
.task {
background: #1c1d24;
padding: 16px;
border-radius: 15px;
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 15px;
}
.task-info {
display: flex;
align-items: center;
gap: 12px;
}
.checkbox {
width: 23px;
height: 23px;
accent-color: #a78bfa;
}
.done .task-name {
text-decoration: line-through;
color: #777;
}
.task-time {
display: block;
font-size: 11px;
color: #777;
margin-top: 2px;
}
.delete-btn {
background: none;
border: none;
color: #ff4a4a;
font-weight: bold;
cursor: pointer;
}
.add-box {
display: flex;
gap: 8px;
margin-top: 15px;
}
.add-box input, .add-box select {
flex: 1;
min-width: 0;
background: #252630;
border: 1px solid #383944;
border-radius: 10px;
padding: 13px;
color: white;
outline: none;
}
button {
background: #a78bfa;
border: none;
padding: 12px 16px;
border-radius: 10px;
font-weight: bold;
color: #17121f;
cursor: pointer;
}
</style>
</head>
<body>
<header>
<div>
<div class="logo">Day<span>Rise.</span></div>
<div class="date" id="date"></div>
</div>
</header>
<div class="card">
<div class="progress-title">TODAY'S PROGRESS</div>
<div class="progress-number" id="percent">0%</div>
<div class="progress-bg">
<div class="progress-fill" id="bar"></div>
</div>
</div>
<div class="stats">
<div class="stat">
<h2 id="completed">0</h2>
<p>Completed</p>
</div>
<div class="stat">
<h2 id="total">0</h2>
<p>Total Tasks</p>
</div>
<div class="stat">
<h2>🏆</h2>
<p>Rewards</p>
</div>
</div>
<div class="section-title">My Daily Routine</div>
<div id="tasks"></div>
<div class="add-box">
<input type="text" id="newTask" placeholder="Add a new routine...">
< id="newTime">
\`\<input type="time" id="newTime"\>
<button onclick="addTask()">+</button>
</div>
<script>
document.getElementById('date').innerText = new Date().toDateString();
let data = JSON.parse(localStorage.getItem("dayrise")) || [];
function save() {
localStorage.setItem("dayrise", JSON.stringify(data));
render();
}
function render() {
let container = document.getElementById('tasks');
container.innerHTML = "";
let completedCount = 0;
data.forEach((task, index) => {
if (task.done) completedCount++;
let taskDiv = document.createElement('div');
taskDiv.className = task ${task.done ? 'done' : ''};
taskDiv.innerHTML = <div class="task-info"> <input type="checkbox" class="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${index})"> <div> <strong>${task.name}</strong> <span class="task-time">${task.time}</span> </div> </div> <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>;
container.appendChild(taskDiv);
});
document.getElementById('completed').innerText = completedCount;
document.getElementById('total').innerText = data.length;
let percent = data.length > 0 ? Math.round((completedCount / data.length) * 100) : 0;
document.getElementById('percent').innerText = ${percent}%;
document.getElementById('bar').style.width = ${percent}%;
}
function addTask() {
let input = document.getElementById('newTask');
let timeInput = document.getElementById('newTime');
if (input.value.trim() === "") return;
data.push({ name: input.value, time: timeInput.value, done: false });
input.value = "";
save();
}
function toggleTask(index) {
data[index].done = !data[index].done;
save();
}
function deleteTask(index) {
data.splice(index, 1);
save();
}
render();
</script>
</body>
</html>
